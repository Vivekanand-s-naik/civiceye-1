# Alembic configuration file

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Timezone to use when rendering dates within the migration file
# Leave blank for localtime, or set to a timezone identifier like 'UTC', 'US/Eastern', etc.
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Database URL - will be overridden by env.py from .env file
sqlalchemy.url = postgresql://user:pass@localhost/dbname

# Post-write hooks
# (these are file hooks and may require user confirmation)
[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
